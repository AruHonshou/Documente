services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - backend_data:/app/data
    depends_on: []

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:${PORT:-3000}"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
